services:
  web:
    image: content-enginge-web-dev
    build:
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./apps/web:/app
      # Dependencies and Next.js cache belong to the Linux container.
      - /app/node_modules
      - /app/.next
