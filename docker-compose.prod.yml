# Produkcja: samodzielny plik (nie łączyć z docker-compose.yml). Uruchamiany przez `make deploy`.
# Wymaga w .env: APP_KEY, APP_URL, FRONTEND_URL, SESSION_DOMAIN, SANCTUM_STATEFUL_DOMAINS, POSTGRES_PASSWORD,
# NEXT_PUBLIC_API_URL i kluczy API (opis w .env.example). Osobna nazwa projektu izoluje kontenery i wolumeny od dev.
name: content-engine-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-platform: &platform
  image: content-engine-platform:prod
  build:
    context: ./apps
    dockerfile: platform/Dockerfile
    target: app
  env_file: .env
  environment: &platform-env
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    # Jedno źródło danych logowania: połączenie z bazą składamy z POSTGRES_*, nadpisując DB_* z .env.
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${POSTGRES_DB:-content}
    DB_USERNAME: ${POSTGRES_USER:-content}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    REDIS_HOST: redis
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
  volumes:
    - storage:/srv/platform/storage/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:-content}
    # Bez publikowanego portu: baza dostępna tylko w sieci compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF: zadania kolejki i sesje przetrwają restart Redisa.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *platform
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"

  platform:
    <<: *platform
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./apps/platform/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Domyślnie tylko localhost: publiczny ruch przez reverse proxy (nginx/Caddy) z TLS.
    ports:
      - "${API_BIND:-127.0.0.1:8000}:80"
    depends_on:
      - platform
    logging: *logging

  queue:
    <<: *platform
    command: ["php", "artisan", "queue:work", "redis", "--queue=pipeline,default", "--sleep=1", "--timeout=1800", "--tries=0", "--max-time=3600"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *platform
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: content-engine-web:prod
    build:
      context: ./apps/web
      target: runner
      args:
        # Wkompilowany w bundle: musi być publicznym adresem API widzianym z przeglądarki.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?ustaw publiczny NEXT_PUBLIC_API_URL w .env}
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      - nginx
    logging: *logging

volumes:
  pgdata:
  redisdata:
  storage:
