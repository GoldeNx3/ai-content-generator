server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    root /srv/platform/public;

    location = /up {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/platform/public/index.php;
        fastcgi_pass platform:9000;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/platform/public/index.php;
        fastcgi_read_timeout 60s;
        fastcgi_pass platform:9000;
    }
}
