x-platform: &platform
  image: content-engine-platform-dev
  build:
    context: ./apps
    dockerfile: platform/Dockerfile
    target: base
  environment:
    DB_HOST: db
    REDIS_HOST: redis
  volumes:
    - ./apps/platform:/srv/platform
    - ./apps/api:/srv/ai
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
      POSTGRES_DB: content
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *platform
    command: ["sh", "-c", "composer install --no-interaction --prefer-dist && php artisan migrate --force"]
    restart: "no"

  platform:
    <<: *platform
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      PHP_CLI_SERVER_WORKERS: "8"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *platform
    command: ["php", "artisan", "queue:work", "redis", "--queue=pipeline,default", "--sleep=1", "--timeout=1800", "--tries=0"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *platform
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - platform

volumes:
  pgdata:
